<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Graduation Admin · Em Long</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#200205;--panel:#36070c;--gold:#e2c47d;--gold2:#b98a3c;--cream:#fff7e7;--muted:#ccb9ad;--line:rgba(226,196,125,.18);--red:#7b1320}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(226,196,125,.1),transparent 28%),linear-gradient(160deg,#170103,var(--bg) 50%,#3a060b);color:var(--cream);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.title h1{margin:0;font-family:"Cormorant Garamond",serif;font-size:clamp(36px,7vw,58px)}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#f2dda7,#bb8d3d);color:#311500}.btn.secondary{background:transparent;color:var(--gold);border:1px solid var(--line)}.auth,.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border-radius:22px;padding:20px;box-shadow:0 22px 60px rgba(0,0,0,.24)}.auth{display:grid;gap:12px;margin-bottom:18px}.auth-row{display:grid;grid-template-columns:1fr;gap:10px}.auth input{width:100%;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;padding:13px 14px;outline:none}.auth input:focus{border-color:rgba(226,196,125,.48)}.status{color:var(--muted);font-size:13px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035)}.stat b{display:block;font-family:"Cormorant Garamond",serif;font-size:34px;color:var(--gold)}.stat span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}.grid{display:grid;gap:18px}.card h2{margin:0 0 15px;font-family:"Cormorant Garamond",serif;font-size:34px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.feed{display:grid;gap:10px}.item{padding:15px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(226,196,125,.11)}.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.name{font-family:"Cormorant Garamond",serif;font-size:26px;color:#fff3d8}.time{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#a9958c}.meta{font-size:12px;color:var(--gold);margin:4px 0 8px}.body{font-size:14px;line-height:1.7;color:#ddcbc0;white-space:pre-wrap}.empty{border:1px dashed var(--line);padding:18px;border-radius:16px;color:var(--muted);text-align:center}.error{color:#ffbdc5}.ok{color:#d9efba}@media(min-width:700px){.auth-row{grid-template-columns:1fr auto auto}.stats{grid-template-columns:repeat(4,1fr)}}@media(min-width:960px){.grid{grid-template-columns:1.15fr .85fr}.wrap{padding-top:42px}.card{padding:26px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="title"><h1>Graduation Inbox</h1><p>RSVP & lưu bút · em Long</p></div>
      <a class="btn secondary" href="/">Về thiệp mời</a>
    </div>

    <section class="auth">
      <strong>ADMIN_TOKEN</strong>
      <div class="auth-row">
        <input id="token" type="password" autocomplete="off" placeholder="Nhập ADMIN_TOKEN để xem RSVP">
        <button class="btn" id="loadBtn" type="button">Mở inbox</button>
        <button class="btn secondary" id="clearBtn" type="button">Khoá</button>
      </div>
      <div class="status" id="status">Token chỉ được giữ trong sessionStorage của tab này, không ghi vào URL.</div>
    </section>

    <div class="stats">
      <div class="stat"><b id="attending">—</b><span>Sẽ tham dự</span></div>
      <div class="stat"><b id="maybe">—</b><span>Có thể</span></div>
      <div class="stat"><b id="declined">—</b><span>Không tham dự</span></div>
      <div class="stat"><b id="guestbookCount">—</b><span>Lưu bút</span></div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Xác nhận tham dự</h2>
        <div class="toolbar">
          <button class="btn secondary" id="refreshBtn" type="button">Làm mới</button>
          <button class="btn secondary" id="csvBtn" type="button">Tải CSV</button>
        </div>
        <div class="feed" id="rsvpFeed"><div class="empty">Nhập ADMIN_TOKEN để tải danh sách RSVP.</div></div>
      </section>

      <section class="card">
        <h2>Lưu bút</h2>
        <div class="feed" id="guestbookFeed"><div class="empty">Đang tải…</div></div>
      </section>
    </div>
  </main>
<script>
  const $=s=>document.querySelector(s);
  const esc=(s='')=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const fmt=iso=>{try{return new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso))}catch{return iso||''}};
  const label=v=>({attending:'Sẽ tham dự',maybe:'Có thể tham dự',declined:'Không tham dự'}[v]||v||'');
  const tokenInput=$('#token');
  tokenInput.value=sessionStorage.getItem('graduation-admin-token')||'';

  function setStatus(text,type=''){const el=$('#status');el.textContent=text;el.className='status '+type}
  function rsvpHtml(r){return `<article class="item"><div class="item-head"><div><div class="name">${esc(r.guest_name)}</div><div class="meta">${esc(label(r.attendance))}${r.arrival_time?' · '+esc(r.arrival_time):''}${Number(r.companions)>0?' · +'+Number(r.companions)+' người':''}</div></div><div class="time">${esc(fmt(r.created_at))}</div></div><div class="body">${r.guest_relation?'Quan hệ: '+esc(r.guest_relation)+'\n':''}${r.contact?'Liên hệ: '+esc(r.contact)+'\n':''}${r.note?esc(r.note):''}</div></article>`}
  function messageHtml(m){return `<article class="item"><div class="item-head"><div><div class="name">${esc(m.name)}</div>${m.title?`<div class="meta">${esc(m.title)}</div>`:''}</div><div class="time">${esc(fmt(m.created_at))}</div></div><div class="body">${esc(m.message)}</div></article>`}

  async function loadGuestbook(){
    const root=$('#guestbookFeed');
    try{const res=await fetch('/api/guestbook',{cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'Không tải được lưu bút');const rows=data.messages||[];$('#guestbookCount').textContent=rows.length;root.innerHTML=rows.length?rows.map(messageHtml).join(''):'<div class="empty">Chưa có lưu bút.</div>'}catch(e){root.innerHTML=`<div class="empty error">${esc(e.message)}</div>`;$('#guestbookCount').textContent='!'}
  }

  async function loadRsvp(){
    const token=tokenInput.value.trim();if(!token){setStatus('Thiếu ADMIN_TOKEN.','error');return}
    sessionStorage.setItem('graduation-admin-token',token);setStatus('Đang tải…');
    const root=$('#rsvpFeed');
    try{const res=await fetch('/api/rsvp',{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'Không tải được RSVP');const rows=data.rsvps||[];root.innerHTML=rows.length?rows.map(rsvpHtml).join(''):'<div class="empty">Chưa có RSVP.</div>';$('#attending').textContent=rows.filter(x=>x.attendance==='attending').length;$('#maybe').textContent=rows.filter(x=>x.attendance==='maybe').length;$('#declined').textContent=rows.filter(x=>x.attendance==='declined').length;setStatus(`Đã tải ${rows.length} phản hồi.`,'ok')}catch(e){root.innerHTML=`<div class="empty error">${esc(e.message)}</div>`;setStatus(e.message,'error')}
  }

  async function downloadCsv(){
    const token=tokenInput.value.trim();if(!token){setStatus('Thiếu ADMIN_TOKEN.','error');return}
    try{const res=await fetch('/api/rsvp?format=csv',{headers:{Authorization:`Bearer ${token}`}});if(!res.ok)throw new Error('Không tải được CSV');const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='long-graduation-rsvps.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}catch(e){setStatus(e.message,'error')}
  }

  $('#loadBtn').onclick=loadRsvp;$('#refreshBtn').onclick=()=>{loadRsvp();loadGuestbook()};$('#csvBtn').onclick=downloadCsv;$('#clearBtn').onclick=()=>{sessionStorage.removeItem('graduation-admin-token');tokenInput.value='';$('#rsvpFeed').innerHTML='<div class="empty">Đã khoá inbox.</div>';['attending','maybe','declined'].forEach(id=>$('#'+id).textContent='—');setStatus('Đã xoá token khỏi session.')};tokenInput.addEventListener('keydown',e=>{if(e.key==='Enter')loadRsvp()});
  loadGuestbook();if(tokenInput.value)loadRsvp();
</script>
</body>
</html>
