name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing repository secret VERCEL_TOKEN"
            exit 1
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --project graduation-landing --token "$VERCEL_TOKEN"

      - name: Ensure private Blob store
        shell: bash
        run: |
          set -euo pipefail
          if vercel blob list-stores --all --token "$VERCEL_TOKEN" 2>/dev/null | grep -q "long-graduation-data"; then
            echo "Blob store already exists"
          else
            vercel blob create-store long-graduation-data \
              --access private \
              --environment production \
              --yes \
              --token "$VERCEL_TOKEN"
          fi

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build production bundle
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
